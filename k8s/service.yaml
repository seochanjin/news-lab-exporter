apiVersion: v1
kind: Service
metadata:
  name: news-lab-exporter
  labels:
    app: news-lab-exporter
spec:
  # 외부에 노출하지 않는다. Prometheus가 클러스터 안에서 접근하면 충분하므로
  # Ingress를 만들지 않고 ClusterIP만 둔다.
  type: ClusterIP
  selector:
    app: news-lab-exporter
  ports:
    # ServiceMonitor가 이름으로 참조하므로 name이 필요하다.
    - name: metrics
      port: 9310
      targetPort: metrics
