apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: news-lab-exporter
  labels:
    app: news-lab-exporter
    # kube-prometheus-stack values에 serviceMonitorSelectorNilUsesHelmValues 설정이 없으므로
    # chart 기본값(true)이 적용된다. 이 경우 Prometheus는 Helm release 이름 label이 붙은
    # ServiceMonitor만 수집한다. 현재 release 이름은 monitoring이다.
    # 이 label이 없으면 manifest를 apply해도 Prometheus가 조용히 무시한다.
    release: monitoring
spec:
  selector:
    matchLabels:
      app: news-lab-exporter
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    # 타임아웃 순서: exporter 내부 context(10s) < scrapeTimeout(30s) < interval(60s)
    # 안쪽이 먼저 끊겨야 어느 쿼리가 느린지 query_success로 드러난다.
    #
    # interval이 60s인 이유는 이 지표들이 하루 단위 CronJob 결과이기 때문이다.
    # 더 자주 긁어도 값이 바뀌지 않고 운영 DB 조회만 늘어난다.
    - port: metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
