name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - "main.go"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: seocj/news-lab-exporter

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "${unformatted}" ]]; then
            echo "gofmt required for:" >&2
            echo "${unformatted}" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify immutable image tag source
        run: |
          if [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GITHUB_SHA must be a full 40-character lowercase Git SHA" >&2
            exit 1
          fi

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  update-manifest:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Update Kubernetes manifest image tag
        run: |
          ruby <<'RUBY'
          sha = ENV.fetch("GITHUB_SHA")
          image_name = ENV.fetch("IMAGE_NAME")

          unless sha.match?(/\A[0-9a-f]{40}\z/)
            warn "GITHUB_SHA must be a full 40-character lowercase Git SHA"
            exit 1
          end

          path = "k8s/deployment.yaml"
          image = "#{image_name}:#{sha}"

          content = File.read(path)
          updated = content.gsub(%r{image:\s*seocj/news-lab-exporter:[0-9A-Za-z._-]+}, "image: #{image}")

          if updated == content
            warn "No #{image_name} image reference found in #{path}"
            exit 1
          end

          File.write(path, updated)
          RUBY

      - name: Verify manifest image update
        run: |
          ruby -ryaml <<'RUBY'
          doc = YAML.load_file("k8s/deployment.yaml")
          raise "expected Deployment" unless doc["kind"] == "Deployment"

          containers = Array(doc.dig("spec", "template", "spec", "containers"))
          images = containers.map { |c| c["image"] }
                             .select { |i| i&.start_with?("#{ENV.fetch("IMAGE_NAME")}:") }

          raise "expected one exporter image, got #{images.size}" unless images.size == 1

          tag = images.first.split(":", 2).last
          raise "image tag is not full git SHA: #{tag}" unless tag.match?(/\A[0-9a-f]{40}\z/)
          raise "image tag does not match workflow SHA" unless tag == ENV.fetch("GITHUB_SHA")

          puts "manifest image update verified: #{images.first}"
          RUBY

      - name: Create manifest update pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/update-exporter-image-${{ github.sha }}
          base: main
          commit-message: Update news-lab-exporter image to ${{ github.sha }}
          title: Update news-lab-exporter image to ${{ github.sha }}
          body: |
            Updates the exporter Kubernetes manifest after a successful image build.

            - Source repository: seochanjin/news-lab-exporter
            - Source commit: ${{ github.sha }}
            - Image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
            - Resource: Deployment/news-lab-exporter
